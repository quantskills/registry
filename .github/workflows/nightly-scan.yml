name: nightly-scan

on:
  schedule:
    - cron: "30 16 * * *" # UTC 16:30 = 00:30 Beijing time
  workflow_dispatch:
    inputs:
      full:
        description: "Revalidate the complete inventory"
        type: boolean
        default: false
      contract_mode:
        description: "Audit retains migration diagnostics; enforce permits publication"
        type: choice
        options: [audit, enforce]
        default: audit

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Scheduled runs are always audit. Only dispatch can select enforce.
      CONTRACT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_mode || 'audit' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - name: Build registry
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full == false) }}
        env:
          # Read token is only used to list and clone asset repositories.
          GITHUB_TOKEN: ${{ secrets.QS_READ_TOKEN }}
          QS_ORG: quantskills
        run: |
          python scripts/build_registry.py --contract-mode "$CONTRACT_MODE" --inventory catalog-inventory.v1.json --assignments migration/catalog-assignments-2026-08-29-reviewed.csv

      - name: Build registry (full compatibility)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
        env:
          # Read token is only used to list and clone asset repositories.
          GITHUB_TOKEN: ${{ secrets.QS_READ_TOKEN }}
          QS_ORG: quantskills
        run: |
          python scripts/build_registry.py --contract-mode "$CONTRACT_MODE" --full --inventory catalog-inventory.v1.json --assignments migration/catalog-assignments-2026-08-29-reviewed.csv

      - name: Final enforce validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_mode == 'enforce' }}
        run: |
          python scripts/verify_catalog_artifacts.py catalog.snapshot.json registry.json --readme README.md --readme README.en.md --expected-contract-mode enforce
          node scripts/validate-registry.mjs --contract-mode enforce registry.json

      # Audit output is ephemeral. It must not replace the last enforce-clean snapshot.
      - name: Commit artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.contract_mode == 'enforce' }}
        run: |
          git config user.name "qs-registry-auditor"
          git config user.email "auditor@quantskills.ai"
          git add catalog.snapshot.json registry.json INDEX.md llms.txt .claude-plugin/marketplace.json README.md README.en.md
          git diff --cached --quiet || git commit -m "chore(registry): enforce catalog scan $(date -u +%Y-%m-%d)"
          git push
