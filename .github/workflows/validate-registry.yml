name: Validate registry

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: quantskills/skill-template
          path: .contract/skill-template
      - uses: actions/checkout@v4
        with:
          repository: quantskills/agent-template
          path: .contract/agent-template
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        env:
          QS_SKILL_TEMPLATE_PATH: ${{ github.workspace }}/.contract/skill-template
          QS_AGENT_TEMPLATE_PATH: ${{ github.workspace }}/.contract/agent-template
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate registry snapshot
        run: node scripts/validate-registry.mjs
